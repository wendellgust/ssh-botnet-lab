<text class="sub"   x="260" y="485" text-anchor="middle">172.21.0.20</text>
<text class="lbl"   x="260" y="498" text-anchor="middle">pivot · dual-homed</text>

<!-- victim2 -->
<rect x="360" y="452" width="110" height="48" rx="6" fill="#f0f3f8" stroke="#7a8faa" stroke-width="0.8"/>
<text class="title" x="415" y="470" text-anchor="middle">Victim 2</text>
<text class="sub"   x="415" y="486" text-anchor="middle">172.21.0.21</text>

<!-- monitor -->
<rect x="504" y="452" width="106" height="48" rx="6" fill="#e8f8f2" stroke="#1a7a4a" stroke-width="0.8"/>
