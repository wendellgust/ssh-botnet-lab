<svg width="680" height="1560" viewBox="0 0 680 1560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>SSH Botnet Lab — All 4 Network Scenarios</title>
<desc>Four network topologies: single network, two segmented networks with pivot, three networks with two pivots, and a deep three-hop chain.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: ui-monospace, 'Cascadia Code', monospace; }
    .title { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
    .sub   { font-size: 11px; fill: #555; }
    .lbl   { font-size: 10px; fill: #777; }
    .head  { font-size: 14px; font-weight: 700; fill: #111; }
    .net   { font-size: 10px; fill: #3a6a9a; }
    .net2  { font-size: 10px; fill: #1a7a3a; }
    .net3  { font-size: 10px; fill: #7a5a1a; }
    .net4  { font-size: 10px; fill: #5a1a7a; }
    .badge { font-size: 9px; font-weight: 600; fill: #fff; }
  </style>
</defs>

<!-- background -->
<rect width="680" height="1560" fill="#f8f9fb" rx="0"/>

<!-- ═══════════════════════════════════════════════════════ -->
<!-- SCENARIO 1                                             -->
<!-- ═══════════════════════════════════════════════════════ -->
<rect x="20" y="20" width="640" height="320" rx="12" fill="#fff" stroke="#dde2ec" stroke-width="1"/>
<text class="head" x="40" y="52">Scenario 1 — Single Network</text>
<text class="sub"  x="40" y="70">./start.sh 1  ·  No segmentation, all machines visible to attacker</text>

<!-- attack_net container -->
<rect x="36" y="84" width="608" height="224" rx="8" fill="#eef4ff" stroke="#7aabdf" stroke-width="0.5" stroke-dasharray="5 3"/>
<text class="net" x="52" y="102">attack_net · 172.21.0.0/24</text>

<!-- attacker -->
<rect x="56"  y="114" width="118" height="48" rx="6" fill="#fde8e0" stroke="#c0532a" stroke-width="1"/>
<rect x="56"  y="114" width="118" height="14" rx="6" fill="#c0532a"/>
<rect x="56"  y="121" width="118" height="7"  rx="0" fill="#c0532a"/>
<text class="badge" x="115" y="124" text-anchor="middle">ATTACKER</text>
<text class="title" x="115" y="144" text-anchor="middle">172.21.0.10</text>
<text class="sub"   x="115" y="158" text-anchor="middle">Kali Linux</text>

<!-- victim1 -->
<rect x="390" y="102" width="138" height="46" rx="6" fill="#f0f3f8" stroke="#7a8faa" stroke-width="0.8"/>
<text class="title" x="459" y="122" text-anchor="middle">Victim 1</text>
<text class="sub"   x="459" y="138" text-anchor="middle">172.21.0.20</text>

<!-- victim2 -->
<rect x="390" y="160" width="138" height="46" rx="6" fill="#f0f3f8" stroke="#7a8faa" stroke-width="0.8"/>
<text class="title" x="459" y="180" text-anchor="middle">Victim 2</text>
<text class="sub"   x="459" y="196" text-anchor="middle">172.21.0.21</text>

<!-- victim3 -->
<rect x="390" y="218" width="138" height="46" rx="6" fill="#f0f3f8" stroke="#7a8faa" stroke-width="0.8"/>
<text class="title" x="459" y="238" text-anchor="middle">Victim 3</text>
<text class="sub"   x="459" y="254" text-anchor="middle">172.21.0.22</text>

<!-- arrows -->
<line x1="176" y1="138" x2="388" y2="125" stroke="#c0532a" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="176" y1="138" x2="388" y2="183" stroke="#c0532a" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="176" y1="138" x2="388" y2="241" stroke="#c0532a" stroke-width="1.4" marker-end="url(#arr)"/>
<text class="lbl" x="286" y="110" text-anchor="middle">SSH brute-force</text>

<!-- monitor -->
<rect x="56" y="250" width="200" height="40" rx="6" fill="#e8f8f2" stroke="#1a7a4a" stroke-width="0.8"/>
<text class="title" x="156" y="267" text-anchor="middle">Monitor</text>
<text class="sub"   x="156" y="282" text-anchor="middle">172.21.0.100 · IDS</text>


