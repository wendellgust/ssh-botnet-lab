<text class="sub"   x="557" y="486" text-anchor="middle">172.21.0.100</text>

<!-- internal_net -->
<rect x="36" y="572" width="430" height="120" rx="8" fill="#eefaf2" stroke="#4ab07a" stroke-width="0.5" stroke-dasharray="5 3"/>
