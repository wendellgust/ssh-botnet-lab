<!-- victim3 -->
<rect x="56"  y="602" width="130" height="48" rx="6" fill="#f0f3f8" stroke="#7a8faa" stroke-width="0.8"/>
<text class="title" x="121" y="620" text-anchor="middle">Victim 3</text>
<text class="sub"   x="121" y="636" text-anchor="middle">10.10.0.10</text>

<!-- honeypot -->
<rect x="216" y="602" width="130" height="48" rx="6" fill="#f4eeff" stroke="#8855cc" stroke-width="1"/>
<text class="title" x="281" y="620" text-anchor="middle">Honeypot</text>
<text class="sub"   x="281" y="636" text-anchor="middle">10.10.0.50</text>

<!-- brute-force arrow -->
<line x1="166" y1="476" x2="194" y2="476" stroke="#c0532a" stroke-width="1.5" marker-end="url(#arr)"/>
<text class="lbl" x="180" y="466" text-anchor="middle">brute-force</text>

<!-- pivot arrow -->
<path d="M260,500 L260,550 L121,550 L121,600" fill="none" stroke="#b07a10" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arr)"/>
<text class="lbl" x="190" y="543" text-anchor="middle">pivot</text>


