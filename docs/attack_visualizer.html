<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SSH Botnet Lab — Live Attack Visualizer</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0e17; color:#c8d8f0; font-family:'Segoe UI',monospace; overflow:hidden; height:100vh; display:flex; flex-direction:column; }

/* ── header ── */
header { padding:10px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #1a2a3a; background:#080c14; flex-shrink:0; }
header h1 { font-size:13px; letter-spacing:3px; color:#4ac8ff; text-transform:uppercase; }
.badge { font-size:10px; padding:3px 8px; border:1px solid #ff3a3a55; color:#ff6666; border-radius:2px; letter-spacing:2px; }

/* ── main layout ── */
main { flex:1; display:flex; gap:0; overflow:hidden; }
#canvas-area { flex:1; position:relative; }
canvas { position:absolute; top:0; left:0; }

/* ── side panel ── */
#panel { width:260px; border-left:1px solid #1a2a3a; display:flex; flex-direction:column; background:#080c14; }
#panel h2 { font-size:10px; letter-spacing:2px; color:#4ac8ff; padding:10px 14px; border-bottom:1px solid #1a2a3a; }
#log { flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:4px; }
.le { font-size:10px; font-family:monospace; padding:4px 8px; border-radius:2px; line-height:1.5; border-left:2px solid; }
.le-info  { color:#4a7a9a; border-color:#1a3a5a; }
.le-warn  { color:#c8903a; border-color:#5a3a0a; }
.le-alert { color:#ff5555; border-color:#aa1111; background:#1a0505; }
.le-ok    { color:#3acc88; border-color:#0a5533; }
.le-c2    { color:#aa77ff; border-color:#441166; }

/* ── controls ── */
#controls { padding:10px 14px; border-top:1px solid #1a2a3a; display:flex; flex-direction:column; gap:6px; }
#controls p { font-size:9px; color:#2a4a6a; letter-spacing:1px; text-transform:uppercase; }
.btn { font-size:10px; padding:7px 12px; border-radius:3px; border:1px solid; cursor:pointer; letter-spacing:1px; background:transparent; text-align:left; transition:all .2s; font-family:monospace; }
.btn:disabled { opacity:.3; cursor:default; }
.b1 { border-color:#1a5a8a; color:#4a9adf; } .b1:hover:not(:disabled) { background:#0a2a4a; }
.b2 { border-color:#8a3a0a; color:#df7a3a; } .b2:hover:not(:disabled) { background:#3a1a0a; }
.b3 { border-color:#7a6a0a; color:#dfba3a; } .b3:hover:not(:disabled) { background:#2a2a0a; }
.b4 { border-color:#5a1a8a; color:#aa66ff; } .b4:hover:not(:disabled) { background:#1a0a2a; }
.b5 { border-color:#0a6a3a; color:#3acf88; } .b5:hover:not(:disabled) { background:#0a2a1a; }
.b-reset { border-color:#2a2a2a; color:#556; } .b-reset:hover { background:#111; color:#88a; }
.btn.active { filter:brightness(1.4); }

/* ── footer ── */
footer { padding:6px 20px; border-top:1px solid #1a2a3a; background:#080c14; font-size:9px; color:#2a4a6a; letter-spacing:2px; display:flex; justify-content:space-between; flex-shrink:0; }
</style>
</head>
<body>
<header>
  <h1>⬡ SSH Botnet Lab — Attack Visualizer</h1>
  <span class="badge">ISOLATED LAB · FEUP SSR 2026</span>
</header>
<main>
  <div id="canvas-area">
    <canvas id="bg"></canvas>
    <canvas id="fg"></canvas>
  </div>
  <div id="panel">
    <h2>◈ LIVE EVENT LOG</h2>
    <div id="log"></div>
    <div id="controls">
      <p>Attack phases</p>
      <button class="btn b1" onclick="run(1)">① Reconnaissance scan</button>
      <button class="btn b2" onclick="run(2)">② SSH brute-force</button>
      <button class="btn b3" onclick="run(3)">③ Lateral movement</button>
      <button class="btn b4" onclick="run(4)">④ C2 beaconing</button>
      <button class="btn b5" onclick="run(5)">▶ Full scenario</button>
      <button class="btn b-reset" onclick="doReset()">↺ Reset</button>
    </div>
  </div>
</main>
<footer>
  <span>attack_net: 172.21.0.0/24 · internal_net: 10.10.0.0/24</span>
  <span>Click a node for details</span>
</footer>

<script>
const bgC = document.getElementById('bg');
const fgC = document.getElementById('fg');
const bgX = bgC.getContext('2d');
const fgX = fgC.getContext('2d');
const area = document.getElementById('canvas-area');
let W=0, H=0;

function resize(){
  W = bgC.width = fgC.width = area.offsetWidth;
  H = bgC.height = fgC.height = area.offsetHeight;
  drawBg();
}
window.addEventListener('resize', ()=>{ resize(); });

// ── Node definitions (percent of W/H) ──────────────────────────────────────
const NODES = {
  attacker: { px:.13, py:.32, label:'ATTACKER',  sub:'172.21.0.10', role:'Kali Linux',      net:'a', state:'attacker' },
  victim1:  { px:.40, py:.32, label:'VICTIM 1',  sub:'172.21.0.20', role:'pivot · dual-homed', net:'ab', state:'clean' },
  victim2:  { px:.64, py:.32, label:'VICTIM 2',  sub:'172.21.0.21', role:'Ubuntu SSH',      net:'a', state:'clean' },
  monitor:  { px:.84, py:.32, label:'MONITOR',   sub:'172.21.0.100',role:'IDS · analyzer',  net:'a', state:'monitor' },
  victim3:  { px:.32, py:.72, label:'VICTIM 3',  sub:'10.10.0.10',  role:'internal SSH',    net:'b', state:'clean' },
  honeypot: { px:.58, py:.72, label:'HONEYPOT',  sub:'10.10.0.50',  role:'deception trap',  net:'b', state:'honeypot' },
};

const COLORS = {
  attacker: { bg:'#2a0a0a', border:'#ff4444', text:'#ff8888', glow:'#ff4444' },
  clean:    { bg:'#0a1a2a', border:'#1a4a7a', text:'#4a8ab0', glow:'#1a4a7a' },
  monitor:  { bg:'#0a2a1a', border:'#1a7a4a', text:'#3acc88', glow:'#00ff88' },
  honeypot: { bg:'#1a0a2a', border:'#5a2a9a', text:'#9a66dd', glow:'#7744bb' },
  compromised:{ bg:'#2a1400', border:'#ff6600', text:'#ffaa44', glow:'#ff6600' },
  pivot:    { bg:'#2a1a00', border:'#ffaa00', text:'#ffcc44', glow:'#ffaa00' },
  alerted:  { bg:'#2a0010', border:'#ff0055', text:'#ff4488', glow:'#ff0055' },
};

function np(id){ return { x: NODES[id].px*W, y: NODES[id].py*H }; }

// ── Particle system ─────────────────────────────────────────────────────────
let particles = [];
class Particle {
  constructor(from, to, color, label, cb){
    const a=np(from), b=np(to);
    this.ax=a.x; this.ay=a.y; this.bx=b.x; this.by=b.y;
    this.color=color; this.label=label; this.cb=cb;
    this.t=0; this.spd=0.022+Math.random()*.009; this.done=false;
    this.r=4; this.trail=[];
  }
  tick(){
    this.trail.push({x:this.ax+(this.bx-this.ax)*this.t, y:this.ay+(this.by-this.ay)*this.t, t:this.t});
    if(this.trail.length>12) this.trail.shift();
    this.t+=this.spd;
    if(this.t>=1){ this.t=1; this.done=true; if(this.cb) this.cb(); }
  }
  draw(){
    const x=this.ax+(this.bx-this.ax)*this.t, y=this.ay+(this.by-this.ay)*this.t;
    // trail
    this.trail.forEach((p,i)=>{
      fgX.beginPath();
      fgX.arc(p.x, p.y, this.r*(i/this.trail.length)*0.7, 0, Math.PI*2);
      fgX.fillStyle = this.color + Math.floor((i/this.trail.length)*80).toString(16).padStart(2,'0');
      fgX.fill();
    });
    // head
    fgX.beginPath(); fgX.arc(x,y,this.r,0,Math.PI*2);
    fgX.fillStyle=this.color;
    fgX.shadowColor=this.color; fgX.shadowBlur=14;
    fgX.fill(); fgX.shadowBlur=0;
    if(this.label){
      fgX.font='8px monospace'; fgX.fillStyle=this.color;
      fgX.fillText(this.label, x+7, y-6);
    }
  }
}

// ── Persistent connections ──────────────────────────────────────────────────
let conns = [];

function drawLine(from, to, color, width, alpha, dash, glow){
  const a=np(from), b=np(to);
  fgX.beginPath(); fgX.moveTo(a.x,a.y); fgX.lineTo(b.x,b.y);
  fgX.strokeStyle=color; fgX.lineWidth=width||1;
  fgX.setLineDash(dash||[]); fgX.globalAlpha=alpha||.5;
  if(glow){ fgX.shadowColor=color; fgX.shadowBlur=8; }
  fgX.stroke();
  fgX.setLineDash([]); fgX.globalAlpha=1; fgX.shadowBlur=0;
}

// ── Draw background (static) ────────────────────────────────────────────────
function drawBg(){
  bgX.clearRect(0,0,W,H);

  // attack_net zone
  bgX.beginPath();
  bgX.rect(W*.04, H*.08, W*.88, H*.44);
  bgX.strokeStyle='#0a2a4a'; bgX.lineWidth=1;
  bgX.setLineDash([4,8]); bgX.stroke(); bgX.setLineDash([]);
  bgX.font='10px monospace'; bgX.fillStyle='#0e3a5a';
  bgX.fillText('attack_net · 172.21.0.0/24', W*.05, H*.115);

  // internal_net zone
  bgX.beginPath();
  bgX.rect(W*.04, H*.56, W*.72, H*.36);
  bgX.strokeStyle='#0a2a1a'; bgX.lineWidth=1;
  bgX.setLineDash([4,8]); bgX.stroke(); bgX.setLineDash([]);
  bgX.fillStyle='#0a2a1a';
  bgX.fillText('internal_net · 10.10.0.0/24', W*.05, H*.595);

  // static topology lines
  const lines = [
    ['attacker','victim1','#0a2a3a',.5],[['victim1','victim2','#0a2a3a',.5]],
    ['victim2','monitor','#0a2a3a',.5],
    ['victim3','honeypot','#0a1a0a',.5],
  ];
  [['attacker','victim1'],['victim1','victim2'],['victim2','monitor'],['victim3','honeypot']].forEach(([a,b])=>{
    const pa=np(a),pb=np(b);
    bgX.beginPath(); bgX.moveTo(pa.x,pa.y); bgX.lineTo(pb.x,pb.y);
    bgX.strokeStyle=a==='victim3'||b==='honeypot'?'#0a1a0a':'#0a2a3a';
    bgX.lineWidth=.5; bgX.setLineDash([]); bgX.globalAlpha=.4;
    bgX.stroke(); bgX.globalAlpha=1;
  });
  // dual-homed dashed connector
  const v1=np('victim1'), v3=np('victim3');
  bgX.beginPath(); bgX.moveTo(v1.x,v1.y); bgX.lineTo(v3.x,v3.y);
  bgX.strokeStyle='#0a1a0a'; bgX.lineWidth=.5; bgX.setLineDash([3,8]);
  bgX.globalAlpha=.25; bgX.stroke(); bgX.setLineDash([]); bgX.globalAlpha=1;
}

// ── Draw node ────────────────────────────────────────────────────────────────
function drawNode(id){
  const n=NODES[id];
  const x=n.px*W, y=n.py*H;
  const c=COLORS[n.state]||COLORS.clean;
  const w=id==='victim1'?138:118, h=60, rx=6;
  const lx=x-w/2, ty=y-h/2;

  // glow
  if(n.state==='compromised'||n.state==='pivot'||n.state==='alerted'||n.state==='attacker'||n.state==='monitor'){
    fgX.shadowColor=c.glow; fgX.shadowBlur=18;
  }

  // box
  fgX.beginPath();
  fgX.roundRect(lx,ty,w,h,rx);
  fgX.fillStyle=c.bg; fgX.fill();
  fgX.strokeStyle=c.border; fgX.lineWidth=1; fgX.stroke();
  fgX.shadowBlur=0;

  // status dot
  fgX.beginPath(); fgX.arc(lx+w-12, ty+12, 4, 0, Math.PI*2);
  fgX.fillStyle=c.border;
  if(n.state==='compromised'||n.state==='alerted'||n.state==='pivot'){
    fgX.shadowColor=c.glow; fgX.shadowBlur=8;
  }
  fgX.fill(); fgX.shadowBlur=0;

  // text
  fgX.textAlign='center';
  fgX.font='bold 11px monospace'; fgX.fillStyle=c.text;
  fgX.fillText(n.label, x, ty+20);
  fgX.font='10px monospace'; fgX.fillStyle=c.text+'aa';
  fgX.fillText(n.sub, x, ty+35);
  fgX.font='9px monospace'; fgX.fillStyle=c.text+'66';
  fgX.fillText(n.role, x, ty+50);
  fgX.textAlign='left';
}

// ── Main render loop ─────────────────────────────────────────────────────────
function frame(){
  fgX.clearRect(0,0,W,H);
  conns.forEach(c=>drawLine(c.a,c.b,c.col,c.w||1.5,c.al||.5,c.dash,true));
  Object.keys(NODES).forEach(id=>drawNode(id));
  particles=particles.filter(p=>!p.done);
  particles.forEach(p=>{ p.tick(); p.draw(); });
  requestAnimationFrame(frame);
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function send(from,to,col,lbl,delay,cb){
  setTimeout(()=>particles.push(new Particle(from,to,col,lbl,cb)), delay);
}
function setState(id,state){ NODES[id].state=state; }
function log(msg,type='info'){
  const box=document.getElementById('log');
  const d=document.createElement('div');
  d.className='le le-'+type;
  const t=new Date().toTimeString().slice(0,8);
  d.textContent=`[${t}] ${msg}`;
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
  while(box.children.length>60) box.removeChild(box.children[0]);
}

let busy=false;
function run(phase){
  if(busy) return;
  busy=true;
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
  const cls=['','b1','b2','b3','b4','b5'];
  document.querySelector('.'+cls[phase])?.classList.add('active');
  if(phase===1) p1(()=>{busy=false;});
  if(phase===2) p2(()=>{busy=false;});
  if(phase===3) p3(()=>{busy=false;});
  if(phase===4) p4(()=>{busy=false;});
  if(phase===5) pFull(()=>{busy=false;});
}

function doReset(){
  particles=[]; conns=[];
  Object.keys(NODES).forEach(id=>{
    if(id==='attacker') NODES[id].state='attacker';
    else if(id==='monitor') NODES[id].state='monitor';
    else if(id==='honeypot') NODES[id].state='honeypot';
    else NODES[id].state='clean';
  });
  busy=false;
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('log').innerHTML='';
  log('Lab reset — all nodes clean','ok');
}

// ── Phase 1: Reconnaissance ──────────────────────────────────────────────────
function p1(done){
  log('Phase 1 — Reconnaissance scan','info');
  log('python3 simulator.py scan --network 172.21.0.','info');
  let n=0;
  ['victim1','victim2','monitor'].forEach((t,i)=>{
    send('attacker',t,'#2266cc','SYN',i*300,()=>{
      send(t,'attacker','#1144aa','ACK',0,()=>{
        log(`OPEN 22/tcp → ${t} (${NODES[t].sub})`,'ok');
        if(++n===3){ log('Scan complete — targets found','ok'); setTimeout(done,400); }
      });
    });
  });
}

// ── Phase 2: Brute-force ─────────────────────────────────────────────────────
function p2(done){
  log('Phase 2 — SSH brute-force → victim1 + victim2','warn');
  log('simulator.py bruteforce --target 172.21.0.20 --delay 1.0','warn');
  const tries=['root:password','admin:123456','labuser:test','ubuntu:qwerty','admin:admin'];
  let i=0, i2=0, done1=false, done2=false;

  function checkBothDone(){ if(done1&&done2) setTimeout(done,400); }

  // attack victim1
  function next1(){
    if(i>=tries.length){
      conns.push({a:'attacker',b:'victim1',col:'#ff4400',w:1.5,al:.55});
      setState('victim1','compromised');
      log('CREDENTIAL FOUND: admin:admin @ victim1','alert');
      log('victim1 COMPROMISED','alert');
      done1=true; checkBothDone(); return;
    }
    const ok=i===tries.length-1;
    send('attacker','victim1','#cc2200','AUTH',0,()=>{
      send('victim1','attacker',ok?'#ff8800':'#220000',ok?'OK':'FAIL',0,()=>{
        log(`[v1:${i+1}] ${ok?'✓ CRACKED':'✗ FAILED'}: ${tries[i]}`,'warn');
        i++; setTimeout(next1, 320);
      });
    });
  }

  // attack victim2 with slight delay
  function next2(){
    if(i2>=tries.length){
      conns.push({a:'attacker',b:'victim2',col:'#ff4400',w:1.5,al:.55});
      setState('victim2','compromised');
      log('CREDENTIAL FOUND: admin:admin @ victim2','alert');
      log('victim2 COMPROMISED','alert');
      done2=true; checkBothDone(); return;
    }
    const ok=i2===tries.length-1;
    send('attacker','victim2','#cc2200','AUTH',0,()=>{
      send('victim2','attacker',ok?'#ff8800':'#220000',ok?'OK':'FAIL',0,()=>{
        log(`[v2:${i2+1}] ${ok?'✓ CRACKED':'✗ FAILED'}: ${tries[i2]}`,'warn');
        i2++; setTimeout(next2, 380);
      });
    });
  }

  next1();
  setTimeout(next2, 200); // stagger start slightly
}

// ── Phase 3: Lateral movement ────────────────────────────────────────────────
function p3(done){
  log('Phase 3 — Lateral movement via pivot','warn');
  log('Run FROM victim1, not attacker!','warn');
  setState('victim1','pivot');
  let step=0;
  function go(){
    if(step===0){
      log('victim1 scanning internal_net (10.10.0.x)...','info');
      send('victim1','victim3','#ffaa00','SSH',300,()=>{
        send('victim3','victim1','#ff6600','AUTH',0,()=>{
          setState('victim3','compromised');
          conns.push({a:'victim1',b:'victim3',col:'#ff6600',w:1.5,al:.55});
          log('LATERAL: victim1 → victim3 SUCCESS','alert');
          log('victim3 COMPROMISED (10.10.0.10)','alert');
          step++; setTimeout(go,800);
        });
      });
    } else if(step===1){
      log('victim1 probing honeypot (10.10.0.50)...','warn');
      send('victim1','honeypot','#ffaa00','SSH',200,()=>{
        setState('honeypot','alerted');
        conns.push({a:'victim1',b:'honeypot',col:'#ff0055',w:1.2,al:.6,dash:[3,5]});
        log('⚠ HONEYPOT HIT from 10.10.0.20','alert');
        log('CRITICAL: Attacker reached internal_net!','alert');
        step++; setTimeout(go,800);
      });
    } else {
      log('Lateral movement complete','warn');
      setTimeout(done,400);
    }
  }
  go();
}

// ── Phase 4: C2 beaconing ────────────────────────────────────────────────────
function p4(done){
  log('Phase 4 — C2 beaconing','c2');
  log('Infected bots phone home to C2 listener','c2');
  log('Remember: start listener FIRST on attacker!','warn');
  const bots=['victim1','victim2','victim3'];
  let sent=0; const total=bots.length*3;
  bots.forEach((bot,i)=>{
    [0,1,2].forEach(r=>{
      const target = (bot==='victim3') ? 'victim1' : 'attacker'; // victim3 beacons via victim1
      send(bot,target,'#9944ff','BEACON', i*200+r*1100, ()=>{
        send(target,bot,'#6622bb','CMD',0,()=>{
          log(`BEACON [${bot}] HEARTBEAT seq=${r+1}`,'c2');
          if(++sent===total){
            log('C2-001: beacon pattern detected','alert');
            setTimeout(done,400);
          }
        });
      });
    });
  });
}

// ── Full scenario ─────────────────────────────────────────────────────────────
function pFull(done){
  log('▶ FULL BOTNET SCENARIO','ok');
  doReset();
  setTimeout(()=>p1(()=>
    setTimeout(()=>p2(()=>
      setTimeout(()=>p3(()=>
        setTimeout(()=>p4(()=>{
          log('══════ SCENARIO COMPLETE ══════','ok');
          log('Run: analyzer.py --report','ok');
          done();
        }),600)
      ),600)
    ),500)
  ),300);
}

// ── Canvas click — show node info ─────────────────────────────────────────────
fgC.addEventListener('click', e=>{
  const rect=fgC.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  for(const id in NODES){
    const {x,y}={x:NODES[id].px*W, y:NODES[id].py*H};
    if(Math.abs(mx-x)<70 && Math.abs(my-y)<35){
      const n=NODES[id];
      log(`${n.label} · ${n.sub} · state: ${n.state}`,'info');
      if(id==='victim1') log('victim1 is dual-homed — pivot point','info');
      if(id==='honeypot') log('ANY connection here = attacker alert','warn');
      break;
    }
  }
});

// ── Init ──────────────────────────────────────────────────────────────────────
resize();
frame();
log('Visualizer ready — 6 nodes online','ok');
log('Click a phase button to animate the attack','info');
</script>
</body>
</html>
