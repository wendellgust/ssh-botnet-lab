# Scenario 1 — Single Network
# No segmentation. Attacker can reach all victims directly.
# Demonstrates basic SSH brute-force without lateral movement.
#
# Usage: podman compose -f scenarios/scenario1.yml up -d --build

networks:
  attack_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/24

services:
  attacker:
    build: ./attacker
    container_name: attacker
    hostname: attacker
    networks:
      attack_net:
        ipv4_address: 172.21.0.10
    stdin_open: true
    tty: true
    restart: "no"

  victim1:
    build: ./victim
    container_name: victim1
    hostname: victim1
    networks:
      attack_net:
        ipv4_address: 172.21.0.20
    cap_add:
      - NET_ADMIN

  victim2:
    build: ./victim
    container_name: victim2
    hostname: victim2
    networks:
      attack_net:
        ipv4_address: 172.21.0.21
    cap_add:
      - NET_ADMIN

  victim3:
    build: ./victim
    container_name: victim3
    hostname: victim3
    networks:
      attack_net:
        ipv4_address: 172.21.0.22
    cap_add:
      - NET_ADMIN

  monitor:
    build: ./monitor
    container_name: monitor
    hostname: monitor
    networks:
      attack_net:
        ipv4_address: 172.21.0.100
    stdin_open: true
    tty: true
